spring.application.name=cinema.api

# Configuração do Swagger
springdoc.swagger-ui.path=/swagger-ui.html

# Console do H2
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# Configuração do datasource (H2 em memória)
spring.datasource.url=jdbc:h2:mem:cinema;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.platform=h2
spring.datasource.initialization-mode=always

# Configuração JPA (opcional, mas recomendado para melhor controle)
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
