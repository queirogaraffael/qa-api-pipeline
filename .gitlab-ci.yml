stages:
  - setup
  - postman
  - performance
  - deploy
  - shutdown

start_api:
  stage: setup
  image: docker/compose:latest
  services:
    - docker:dind
  variables:
    DOCKER_HOST: tcp://docker:2375  # Garante a comunicação com o Docker
    DOCKER_TLS_CERTDIR: ""         # Desativa TLS para simplificar a configuração no CI
  script:
    - echo "Instalando dependências do ambiente..."
    - sed -i 's/dl-cdn.alpinelinux.org/mirrors.aliyun.com/' /etc/apk/repositories
    - apk update && apk add --no-cache curl
    - echo "Dependências instaladas com sucesso!"
    - echo "Iniciando docker-compose..."
    - docker-compose up -d
    - echo "docker-compose iniciado. Verificando serviços ativos..."
    - docker ps
    - echo "Aguardando a API ficar pronta..."
    - |
      MAX_RETRIES=12
      RETRY_COUNT=0
      while ! curl -s http://localhost:3000/ || [ "$(curl -s -o /dev/null -w '%{http_code}' http://localhost:3000/)" -ne 200 ]; do
        if [ "$RETRY_COUNT" -ge "$MAX_RETRIES" ]; then
          echo "API não ficou pronta a tempo. Saindo..."
          exit 1
        fi
        echo "Tentativa $((RETRY_COUNT+1))/$MAX_RETRIES"
        RETRY_COUNT=$((RETRY_COUNT+1))
        sleep 5
      done
    - echo "API está pronta e funcional!"
  only:
    - main

postman_tests:
  stage: postman
  image: postman/newman
  script:
    - cd Tests/postman
    - newman run './collection/nestjs-cinema.postman_collection.json' -e './environment/environment-nestjs-cinema.postman_environment.json' -r htmlextra --reporter-htmlextra-export './relatorios/'
  artifacts:
    paths:
      - Tests/postman/relatorios
  only:
    - main

performance_tests:
  stage: performance
  image: grafana/k6
  script:
    - cd Tests/k6/cinema-performance/tests
    - k6 run "movies/PF-001 - Test Create Movies.js"
    - k6 run "movies/PF-002 - Test List Movies.js"
    - k6 run "tickets/PF-003 - Ticket Life Cycle Test.js" --env TEST_TYPE="carga"
    - k6 run "tickets/PF-004 - Tickets Performance Test.js"
  artifacts:
    paths:
      - Tests/k6/relatorios
  allow_failure: true
  only:
    - main

deploy_api:
  stage: deploy
  image: node:20
  script:
    - mkdir -p ~/.ssh
    - echo "$SSH_PRIVATE_KEY" > ~/.ssh/id_rsa
    - chmod 600 ~/.ssh/id_rsa
    - ssh -o StrictHostKeyChecking=no $EC2_SSH_COMMAND << EOF
        if lsof -t -i :3000; then
          echo "Port 3000 is in uso. Finalizando processo..."
          kill -9 $(lsof -t -i :3000)
        fi

        cd /path/to/your/deploy/directory
        git pull origin main
        npm install
        npm run start
      EOF
  only:
    - main

shutdown_api:
  stage: shutdown
  image: docker:latest
  services:
    - docker:dind
  script:
    - docker-compose down
  only:
    - main