workflow:
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event" && $CI_MERGE_REQUEST_TARGET_BRANCH_NAME == "main"'
    - if: '$CI_COMMIT_BRANCH == "main" && $CI_PIPELINE_SOURCE == "push"'

stages:
  - build
  - test
  - quality
  - build_docker_image
  - deploy_test
  - test_postman
  - test_k6

variables:
  SONAR_USER_HOME: "${CI_PROJECT_DIR}/.sonar"
  GIT_DEPTH: "0"

build:
  stage: build
  tags:
    - docker
  image: node:20
  script:
    - cd backend && npm install
  artifacts:
    paths:
      - backend/node_modules/
    expire_in: 1 hour


test:
  stage: test
  tags:
    - docker
  image: node:20
  dependencies:
    - build
  script:
    - cd backend && npm test -- --coverage
  artifacts:
    paths:
      - backend/coverage/
    expire_in: 1 hour


sonarcloud-check:
  stage: quality
  tags:
    - docker
  image:
    name: sonarsource/sonar-scanner-cli:latest
    entrypoint: [""]
  cache:
    key: "${CI_JOB_NAME}"
    paths:
      - .sonar/cache
  dependencies:
    - test
  script:
    - >
      sonar-scanner
      -Dsonar.login=$SONAR_TOKEN
      -Dsonar.projectKey=$CI_PROJECT_PATH_SLUG


verificar-compose:
  stage: quality
  tags:
    - shell
  script:
    - docker-compose config -q
    - echo $?

build_docker_image:
  stage: build_docker_image
  needs:
    - sonarcloud-check
    - verificar-compose
  image: docker:24
  services:
    - docker:24-dind
  variables:
    DOCKER_HOST: tcp://docker:2376
    DOCKER_TLS_CERTDIR: "/certs"
    IMAGE_NAME: raffaelqueiroga/qa-api-pipeline
  script:
    - echo "Fazendo build da imagem Docker..."
    - echo "$DOCKER_HUB_PASSWORD" | docker login -u "$DOCKER_HUB_USERNAME" --password-stdin
    - IMAGE_TAG=$CI_PIPELINE_ID 
    - docker build -t $IMAGE_NAME:$IMAGE_TAG .
    - docker push $IMAGE_NAME:$IMAGE_TAG
    - docker tag $IMAGE_NAME:$IMAGE_TAG $IMAGE_NAME:latest
    - docker push $IMAGE_NAME:latest
    - echo "Imagem Docker construída e enviada para o Docker Hub."


deploy_to_test:
  stage: deploy_test
  needs:
    - build_docker_image
  tags:
    - shell
  script:
    - set -e

    - echo "Configurando chave SSH..."
    - echo "$PRIVATE_KEY" > my_key_pair.pem
    - chmod 600 my_key_pair.pem
    - mkdir -p ~/.ssh
    - ssh-keyscan -H "$TEST_EC2_SSH_TARGET" >> ~/.ssh/known_hosts

    - |
      ssh -i my_key_pair.pem ec2-user@"$TEST_EC2_SSH_TARGET" << EOF
        set -e
        echo "Limpando ambiente Docker e diretório remoto..."
        docker system prune -a --volumes -f
        rm -rf /home/ec2-user/qa-api-pipeline
        echo "Criando diretório remoto..."
        mkdir -p /home/ec2-user/qa-api-pipeline
        echo "Logando no Docker Hub..."
        echo "$DOCKER_HUB_PASSWORD" | docker login -u "$DOCKER_HUB_USERNAME" --password-stdin
        echo "Baixando a imagem mais recente..."
        docker pull raffaelqueiroga/qa-api-pipeline:latest
      EOF

    - echo "Copiando docker-compose.yml..."
    - scp -i my_key_pair.pem docker-compose.yml ec2-user@"$TEST_EC2_SSH_TARGET":/home/ec2-user/qa-api-pipeline/docker-compose.yml

    - |
      ssh -i my_key_pair.pem ec2-user@"$TEST_EC2_SSH_TARGET" << EOF
        set -e

        echo "Subindo containers com Docker Compose..."
        cd /home/ec2-user/qa-api-pipeline
        docker-compose up -d

        echo "Aguardando containers ficarem saudáveis..."
        timeout=60
        while [ \$timeout -gt 0 ]; do
          unhealthy_or_starting=\$(docker ps --filter "health=unhealthy" --filter "health=starting" --format '{{.Names}}')

          if [ -z "\$unhealthy_or_starting" ]; then
            echo "Todos os containers estão saudáveis!"
            break
          fi

          echo "Aguardando containers... restante: \$timeout segundos"
          sleep 5
          timeout=\$((timeout - 5))
        done

        if [ ! -z "\$(docker ps --filter "health=unhealthy" --format '{{.Names}}')" ]; then
          echo "Alguns containers estão com problemas de saúde!"
          docker ps --filter "health=unhealthy"
          exit 1
        fi
      EOF

    - echo "Salvando IP..."
    - mkdir -p artifacts
    - echo "$TEST_EC2_SSH_TARGET" > artifacts/ec2_ip.txt
  artifacts:
    paths:
      - artifacts/ec2_ip.txt


test_postman:
  stage: test_postman
  needs:
    - deploy_to_test
  before_script:
    - PUBLIC_IP=$(cat artifacts/ec2_ip.txt)
  image: postman/newman
  script:
    - newman run tests/postman/collection/qa-api-pipeline.postman_collection.json \
      --environment tests/postman/environment/environment-qa-api-pipeline.postman_environment.json \
      --env-var "base_url=http://$PUBLIC_IP:3000"


test_k6:
  stage: test_k6
  needs:
    - deploy_to_test
  before_script:
    - PUBLIC_IP=$(cat artifacts/ec2_ip.txt)
  image: grafana/k6
  script:
    - k6 run -e API_URL=http://$PUBLIC_IP:3000 tests/k6/qa-api-pipeline-performance/tests/movies/PF-001\ -\ Test\ Create\ Movies.js
    - k6 run -e API_URL=http://$PUBLIC_IP:3000 tests/k6/qa-api-pipeline-performance/tests/movies/PF-002\ -\ Test\ List\ Movies.js