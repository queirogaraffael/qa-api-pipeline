workflow:
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event" && $CI_MERGE_REQUEST_TARGET_BRANCH_NAME == "main"
    - if: $CI_COMMIT_BRANCH == "main" && $CI_PIPELINE_SOURCE == "push"
    - when: never
    
stages:
  - test_unit
  - test_integration
  - build
  - setup_test_env
  - test_postman
  - test_k6
  - cleanup
  - deploy

test_unit:
  stage: test_unit
  script:
    - mvn test -Dtest=*UnitTest

test_integration:
  stage: test_integration
  script:
    - mvn verify -Dtest=*IntegrationTest

build_image:
  stage: build
  needs:
    - test_unit
    - test_integration
  image: docker:24
  services:
    - docker:24-dind
  variables:
    DOCKER_HOST: tcp://docker:2376
    DOCKER_TLS_CERTDIR: "/certs"
  script:
    - echo "Fazendo build da imagem Docker..."
    - echo "$CI_REGISTRY_PASSWORD" | docker login -u "$CI_REGISTRY_USER" --password-stdin
    - IMAGE_TAG=$CI_PIPELINE_ID 
    - docker build -t raffaelqueiroga/nestjs-cinema:$IMAGE_TAG .
    - docker push raffaelqueiroga/nestjs-cinema:$IMAGE_TAG
    - docker tag raffaelqueiroga/nestjs-cinema:$IMAGE_TAG raffaelqueiroga/nestjs-cinema:latest
    - docker push raffaelqueiroga/nestjs-cinema:latest
    - echo "Imagem Docker construída e enviada para o Docker Hub."

setup_test_env:
  stage: setup_test_env
  script:
    # Criar diretório de artifacts primeiro
    - mkdir -p artifacts

    # Obtém o IP da instância EC2
    - PUBLIC_IP=$(aws ec2 describe-instances \
        --filters "Name=tag:Name,Values=my-instance-name" \
        --query 'Reservations[0].Instances[0].PublicIpAddress' \
        --output text)

    # Salva o IP para os próximos stages
    - echo "$PUBLIC_IP" > artifacts/ec2_ip.txt

    # Conecta na EC2 e faz o setup da API
    - |
      ssh -o StrictHostKeyChecking=no ec2-user@$PUBLIC_IP /bin/bash << 'EOF'
      set -e  # Sai ao primeiro erro
      
      # Limpar ambiente
      docker ps -q | xargs --no-run-if-empty docker stop
      docker ps -aq | xargs --no-run-if-empty docker rm
      docker volume prune -f
      docker network prune -f
      docker image prune -af
      
      # Puxar nova versão da API
      docker pull my-app:$CI_COMMIT_SHA
      docker run -d -p 3000:3000 --name cinema-api my-app:$CI_COMMIT_SHA
      
      # Esperar API subir com timeout
      for i in {1..10}; do
        if curl -s http://localhost:3000/health | grep -q "ok"; then
          echo "API pronta!"
          exit 0
        fi
        echo "Aguardando API... ($i/10)"
        sleep 5
      done
      echo "Timeout: API não subiu"
      exit 1
      EOF
  artifacts:
    paths:
      - artifacts/ec2_ip.txt
    expire_in: 1 h


test_postman:
  stage: test_postman
  before_script:
    - PUBLIC_IP=$(cat artifacts/ec2_ip.txt)
  image: postman/newman
  script:
    - newman run Tests/postman/collection/nestjs-cinema.postman_collection.json \
      --environment Tests/postman/environment/environment-nestjs-cinema.postman_environment.json \
      --env-var "base_url=http://$PUBLIC_IP:3000"

test_k6:
  stage: test_k6
  before_script:
    - PUBLIC_IP=$(cat artifacts/ec2_ip.txt)
  image: grafana/k6
  script:
    - k6 run -e API_URL=http://$PUBLIC_IP:3000 Tests/k6/cinema-performance/tests/movies/PF-001\ -\ Test\ Create\ Movies.js
    - k6 run -e API_URL=http://$PUBLIC_IP:3000 Tests/k6/cinema-performance/tests/movies/PF-002\ -\ Test\ List\ Movies.js

cleanup_env:
  stage: cleanup
  needs:
    - test_postman
    - test_k6
  script:
    # Obter IP da EC2
    - PUBLIC_IP=$(cat artifacts/ec2_ip.txt)

    # Conectar na EC2 e limpar os recursos do Docker
    - ssh -o StrictHostKeyChecking=no ec2-user@$PUBLIC_IP << 'EOF'
        echo "Limpando ambiente..."
        docker stop cinema-api || true
        docker rm cinema-api || true
        docker volume prune -f
        docker network prune -f
        docker image prune -af
        echo "Ambiente limpo com sucesso!"
      EOF

deploy:
  stage: deploy
  needs:
    - test_postman
    - test_k6
  script:
    - aws ecs update-service --cluster my-cluster --service my-service --force-new-deployment
  when: manual  # Para evitar deploy automático sem revisão
