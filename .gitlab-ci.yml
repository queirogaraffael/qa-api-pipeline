stages:
  - setup
  - postman
  - performance
  - deploy
  - shutdown

start_api:
  stage: setup
  image: docker/compose:latest
  services:
    - docker:dind
  script:
    - echo "Instalando dependências..."
    - apk update && apk add --no-cache curl
    - echo "Dependências instaladas com sucesso!"
    - echo "Iniciando docker-compose..."
    - docker-compose up -d
    - echo "docker-compose iniciado. Verificando serviços ativos..."
    - docker ps
    - echo "Iniciando verificação da API..."
    - |
      MAX_RETRIES=10
      RETRY_COUNT=0
      while true; do
        echo "Tentativa $((RETRY_COUNT+1)) de $MAX_RETRIES"
        HTTP_CODE=$(curl -s -o /dev/null -w '%{http_code}' http://localhost:3000/)
        echo "Código HTTP: $HTTP_CODE"
        if [ "$HTTP_CODE" -eq 200 ]; then
          echo "A API está pronta!"
          break
        fi
        if [ "$RETRY_COUNT" -ge "$MAX_RETRIES" ]; then
          echo "A API não ficou pronta a tempo. Exibindo logs dos serviços..."
          docker-compose logs
          echo "Saindo..."
          exit 1
        fi
        RETRY_COUNT=$((RETRY_COUNT+1))
        sleep 5
      done
    - echo "API verificada com sucesso!"
  only:
    - main

postman_tests:
  stage: postman
  image: postman/newman
  script:
    - cd Tests/postman
    - newman run './collection/nestjs-cinema.postman_collection.json' -e './environment/environment-nestjs-cinema.postman_environment.json' -r htmlextra --reporter-htmlextra-export './relatorios/'
  artifacts:
    paths:
      - Tests/postman/relatorios
  only:
    - main

performance_tests:
  stage: performance
  image: grafana/k6
  script:
    - cd Tests/k6/cinema-performance/tests
    - k6 run "movies/PF-001 - Test Create Movies.js"
    - k6 run "movies/PF-002 - Test List Movies.js"
    - k6 run "tickets/PF-003 - Ticket Life Cycle Test.js" --env TEST_TYPE="carga"
    - k6 run "tickets/PF-004 - Tickets Performance Test.js"
  artifacts:
    paths:
      - Tests/k6/relatorios
  allow_failure: true
  only:
    - main

deploy_api:
  stage: deploy
  image: node:20
  script:
    - mkdir -p ~/.ssh
    - echo "$SSH_PRIVATE_KEY" > ~/.ssh/id_rsa
    - chmod 600 ~/.ssh/id_rsa
    - ssh -o StrictHostKeyChecking=no $EC2_SSH_COMMAND << EOF
        if lsof -t -i :3000; then
          echo "Port 3000 is in uso. Finalizando processo..."
          kill -9 $(lsof -t -i :3000)
        fi

        cd /path/to/your/deploy/directory
        git pull origin main
        npm install
        npm run start
      EOF
  only:
    - main

shutdown_api:
  stage: shutdown
  image: docker:latest
  services:
    - docker:dind
  script:
    - docker-compose down
  only:
    - main