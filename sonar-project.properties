sonar.projectName=backend
sonar.projectVersion=1.0
sonar.host.url=https://sonarcloud.io
sonar.organization=compass

sonar.sources=backend/src
sonar.tests=backend/test
sonar.test.inclusions=**/*.spec.ts,**/*.test.ts,**/*.e2e-spec.ts

sonar.language=ts
sonar.sourceEncoding=UTF-8

sonar.javascript.lcov.reportPaths=backend/coverage/lcov.info
sonar.ts.eslint.reportPaths=backend/eslint-report.json
sonar.exclusions=**/node_modules/**,**/dist/**
